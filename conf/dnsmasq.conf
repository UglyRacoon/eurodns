# EuroDNS — dnsmasq as a LOCAL FORWARDER (rendered by deploy.sh)
# The public :53 is owned by eurodns-resolver (authoritative for geo domains, incl.
# SVCB). dnsmasq only resolves everything else and caches it, bound to loopback.
port=5353
bind-interfaces
listen-address=127.0.0.1
no-resolv
server=1.1.1.1
server=8.8.8.8
server=9.9.9.9
cache-size=10000
neg-ttl=60
# the per-domain address=/domain/IP rules are dropped in here by build.sh (harmless
# fallback; the resolver answers geo names first)
conf-dir=/etc/dnsmasq.d/,*.conf
