; EuroDNS — DNS-over-TLS via stunnel (rendered by deploy.sh)
; stunnel listens on :853 (DoT) and forwards to local dnsmasq (:53).
[dot]
accept  = 853
local   = 0.0.0.0
connect = 127.0.0.1:53
cert    = /etc/letsencrypt/live/@@MGMT_HOST@@/fullchain.pem
key     = /etc/letsencrypt/live/@@MGMT_HOST@@/privkey.pem
@@STUNNEL_IPV6@@
