# EuroDNS — transparent SNI proxy (rendered by deploy.sh)
# Terminate nothing: ssl_preread reads the SNI, then forwards the raw TLS to the
# real backend. The backend therefore sees THIS server's public IP (the "EU egress").
server {
    listen 443;
@@LISTEN6@@
    ssl_preread on;

    # resolve real backend hostnames (from geo-map.inc) at connection time
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    proxy_pass $eurodns_backend;
    proxy_connect_timeout 5s;
    proxy_timeout 300s;
}
