# EuroDNS — dnsmasq (generated by deploy.sh; values injected from env.conf)
port=53
bind-interfaces
# listen on loopback + the public address(es) we serve DNS on
listen-address=@@LISTEN_ADDRESSES@@
# do not read /etc/resolv.conf; use our own upstreams for non-geo domains
no-resolv
server=1.1.1.1
server=8.8.8.8
server=9.9.9.9
# cache + negative cache to keep the server light
cache-size=10000
neg-ttl=60
# the per-domain address=/domain/IP rules are dropped in here by build.sh
conf-dir=/etc/dnsmasq.d/,*.conf
