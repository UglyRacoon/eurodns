# EuroDNS — website + DoH (rendered by deploy.sh)
# :80  = ACME webroot + redirect everything else to HTTPS
# :8448 = the real site/DoH over TLS (reached because the stream proxy forwards
#         SNI=@@MGMT_HOST@@ to 127.0.0.1:8448). This keeps the LE cert valid for DoH/DoT.

server {
    listen 80;
@@LISTEN6_80@@
    server_name @@MGMT_HOST@@ @@MGMT_ALT@@;
    root /var/www/smartdns;

    location /.well-known/acme-challenge/ { root /var/www/smartdns; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:8448 ssl;
    server_name @@MGMT_HOST@@ @@MGMT_ALT@@;
    root /var/www/smartdns;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/@@MGMT_HOST@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@MGMT_HOST@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # DNS-over-HTTPS (RFC 8484) -> local backend
    location = /dns-query {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # self-test API -> local backend
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # iOS configuration profile (correct MIME so Safari offers install)
    location = /ios/eurodns.mobileconfig {
        default_type application/x-apple-aspen-config;
        add_header Content-Disposition "attachment; filename=eurodns.mobileconfig";
    }

    location / { try_files $uri $uri/ =404; }
}
