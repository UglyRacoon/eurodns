# EuroDNS — nginx stream map (rendered by deploy.sh)
# Included inside the `stream { }` block that deploy.sh sets up.
map $ssl_preread_server_name $eurodns_backend {
    # per-domain geo-unblock entries (generated by build.sh)
    include /etc/nginx/smartdns/geo-map.inc;

    # management / website hostname -> local HTTPS site (127.0.0.1:8448)
    @@MGMT_HOST@@    127.0.0.1:8448;

    # anything else -> the website too (harmless fallback)
    default          127.0.0.1:8448;
}
